<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: #f8fafc;
        margin: 0;
        padding: 24px;
        color: #1e293b;
      }
      .card {
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        padding: 24px;
        border: 1px solid #e2e8f0;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
        border-bottom: 1px solid #f1f5f9;
        padding-bottom: 16px;
      }
      .badge {
        background-color: #fee2e2;
        color: #b91c1c;
        padding: 4px 10px;
        border-radius: 9999px;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      h2 {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
        color: #0f172a;
      }
      .field {
        margin-bottom: 16px;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #475569;
        margin-bottom: 6px;
      }
      input[type="text"], textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 14px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-family: inherit;
        font-size: 14px;
        color: #0f172a;
        transition: all 0.2s ease;
      }
      input[type="text"]:focus, textarea:focus {
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
      }
      .btn-container {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        margin-top: 24px;
      }
      .btn {
        padding: 10px 18px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        border: none;
      }
      .btn-secondary {
        background-color: #f1f5f9;
        color: #475569;
      }
      .btn-secondary:hover {
        background-color: #e2e8f0;
      }
      .btn-primary {
        background-color: #2563eb;
        color: #ffffff;
      }
      .btn-primary:hover {
        background-color: #1d4ed8;
      }
      .info-box {
        background-color: #eff6ff;
        border-left: 4px solid #3b82f6;
        padding: 12px 14px;
        border-radius: 4px;
        font-size: 13px;
        color: #1e40af;
        margin-bottom: 18px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="header">
        <span class="badge">SLA Alert</span>
        <h2>Manager Escalation Review</h2>
      </div>

      <div class="info-box">
        Acknowledging this record records your review timestamp and pauses automated leadership escalation during your grace period.
      </div>

      <div class="field">
        <label for="actionNotes">Root Cause / Recovery Plan Notes *</label>
        <textarea id="actionNotes" rows="4" placeholder="e.g. Contacted Employee; portal downtime resolved. Task ticket will be updated before 11:00 AM."></textarea>
      </div>

      <div class="btn-container">
        <button class="btn btn-secondary" onclick="google.script.host.close()">Cancel</button>
        <button class="btn btn-primary" onclick="submitAcknowledgement()">Confirm & Acknowledge</button>
      </div>
    </div>

    <script>
      function submitAcknowledgement() {
        const notes = document.getElementById('actionNotes').value.trim();
        if (!notes) {
          alert('Please enter your review comments or recovery plan.');
          return;
        }
        google.script.run
          .withSuccessHandler(function() {
            google.script.host.close();
          })
          .withFailureHandler(function(err) {
            alert('Error: ' + err.message);
          })
          .recordManagerAckFromDialog(notes);
      }
    </script>
  </body>
</html>
